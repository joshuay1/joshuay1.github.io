<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Speaker notes · Hacking the Democracy</title>
    <link rel="stylesheet" href="assets/fonts/fonts.css" />
    <style>
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        padding: 32px;
        background: #f2e6ce;
        color: #292b25;
        font:
          18px/1.6 Inter,
          sans-serif;
      }
      h1,
      h2,
      button,
      time {
        font-family: "JetBrains Mono", monospace;
      }
      h1 {
        font-size: 32px;
        line-height: 1.3;
      }
      header,
      nav {
        display: flex;
        gap: 20px;
        align-items: center;
        justify-content: space-between;
      }
      button {
        border: 0;
        background: #d9a747;
        color: #292b25;
        padding: 14px 18px;
        font-size: 16px;
        cursor: pointer;
      }
      #notes {
        white-space: pre-line;
        margin: 30px 0;
        max-width: 900px;
      }
      #next {
        background: #dfb59d;
        padding: 22px;
        margin: 25px 0;
      }
      small {
        font-size: 14px;
      }
      time {
        font-size: 32px;
      }
      nav {
        position: sticky;
        bottom: 0;
        background: #f2e6ce;
        padding: 14px 0;
      }
      #position {
        font-family: "JetBrains Mono", monospace;
      }
    </style>
  </head>
  <body>
    <header>
      <div>
        <small id="position">Speaker view</small>
        <h1 id="title">Open this window from the presentation.</h1>
        <small id="time"></small>
      </div>
      <div><time id="timer">00:00</time><br /><button id="start" type="button">Start timer</button></div>
    </header>
    <div id="notes">Your notes will appear here when the presentation connects.</div>
    <div id="next">Next scene</div>
    <nav>
      <button type="button" data-direction="-1">← Previous</button><button type="button" data-direction="1">Next →</button
      ><button id="reset" type="button">Reset timer</button>
    </nav>
    <script>
      (() => {
        const $ = (s) => document.querySelector(s);
        let start = null,
          elapsed = 0;
        function send(direction) {
          if (window.opener) window.opener.postMessage({ type: "notes-nav", direction }, "*");
        }
        window.addEventListener("message", (event) => {
          if (event.source !== window.opener || !event.data || event.data.type !== "talk-state") return;
          const d = event.data;
          $("#title").textContent = d.title;
          $("#position").textContent = d.index + 1 + " / " + d.total;
          $("#time").textContent = "Planned time: " + d.time;
          $("#notes").textContent = d.notes;
          $("#next").textContent = "Next: " + d.next;
        });
        document.querySelectorAll("[data-direction]").forEach((b) => b.addEventListener("click", () => send(Number(b.dataset.direction))));
        $("#start").addEventListener("click", () => {
          if (start !== null) {
            elapsed += Date.now() - start;
            start = null;
            $("#start").textContent = "Resume timer";
          } else {
            start = Date.now();
            $("#start").textContent = "Pause timer";
          }
        });
        $("#reset").addEventListener("click", () => {
          start = null;
          elapsed = 0;
          $("#start").textContent = "Start timer";
          $("#timer").textContent = "00:00";
        });
        setInterval(() => {
          const seconds = Math.floor((elapsed + (start === null ? 0 : Date.now() - start)) / 1000);
          $("#timer").textContent = String(Math.floor(seconds / 60)).padStart(2, "0") + ":" + String(seconds % 60).padStart(2, "0");
        }, 500);
        if (window.opener) window.opener.postMessage({ type: "notes-ready" }, "*");
      })();
    </script>
  </body>
</html>
