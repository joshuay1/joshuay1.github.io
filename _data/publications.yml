yang2025bridging:
  slug: bridging-voting-deliberation
  title: "Bridging Voting and Deliberation with Algorithms: Field Insights from vTaiwan and Kultur Komitee"
  short_title: "Bridging Voting and Deliberation"
  authors:
    - name: Joshua C. Yang
    - name: Fynn Bachmann
  author_text: "Joshua C. Yang and Fynn Bachmann"
  year: "2025"
  publication_date: "2025"
  venue: "ACM Conference on Fairness, Accountability, and Transparency"
  venue_type: "Conference paper"
  conference: "ACM FAccT"
  doi: "10.1145/3715275.3732205"
  arxiv: "2502.05017"
  source_url: "https://doi.org/10.1145/3715275.3732205"
  pdf_url: "https://arxiv.org/pdf/2502.05017"
  preview: "/assets/img/publication_preview/bridging.png"
  selected: true
  tldr: >-
    Voting and deliberation usually live in separate worlds: one counts preferences, the other helps people think together. This paper shows how algorithms can connect them by forming better discussion groups, making fairer funding choices, and helping people see where opinions shift.
  why: >-
    Digital democracy often separates discussion from decision: deliberation produces insight, voting produces closure, and the two rarely inform each other well. This paper shows how algorithms can help form groups, surface tradeoffs, and make preference shifts visible without treating participants as passive data points.
  abstract: >-
    Based on field experiments in Taiwan and Switzerland, this paper presents hybrid algorithmic designs that integrate deliberation and voting for digital democracy.
  stats:
    - value: "3"
      label: "algorithmic bridges"
    - value: "35"
      label: "KK24 workshop participants"
    - value: "50%"
      label: "KK24 budget delegated to MES"
    - value: "200k+"
      label: "people engaged by vTaiwan since launch"
  highlights:
    - title: "Vote first, deliberate better"
      text: "Preference-based clustering uses voting data to create homogeneous and heterogeneous groups for different deliberation dynamics."
    - title: "Usability beats purity"
      text: "Radial Clustering trades some mathematical optimality for balanced groups and facilitator-friendly interpretation."
    - title: "Algorithms are negotiable"
      text: "Human-in-the-loop MES lets participants decide how much budget is delegated to proportional aggregation."
    - title: "Opinion maps become agenda tools"
      text: "ReadTheRoom uses agreement, disagreement, and opinion shifts to focus deliberation on meaningful divergence."
  best_for: "Designers of civic platforms, participatory budgeting processes, citizens' assemblies, and deliberation workflows that need voting and discussion to reinforce each other."
  keywords:
    - deliberation
    - voting
    - vTaiwan
    - Kultur Komitee
