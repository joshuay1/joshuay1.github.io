acm2026kes:
  slug: komitee-equal-shares
  title: "Komitee Equal Shares: A Hybrid Algorithm for Priceable Participatory Funding"
  short_title: "Komitee Equal Shares"
  authors:
    - name: Joshua C. Yang
    - name: Noemi Scheurer
    - name: Dirk Helbing
  author_text: "Joshua C. Yang, Noemi Scheurer, and Dirk Helbing"
  year: "2026"
  publication_date: "2026"
  venue: "Extended Abstracts of the 2026 CHI Conference on Human Factors in Computing Systems"
  venue_type: "Conference paper"
  conference: "CHI EA '26"
  doi: "10.1145/3772363.3798958"
  source_url: "https://doi.org/10.1145/3772363.3798958"
  preview: "/assets/img/publication_preview/kes.png"
  selected: true
  tldr: >-
    Komitee Equal Shares helps a citizen group fund more than just the obvious crowd favorites. It combines personal votes with small-group evaluation, then shows participants how their input helped pay for the final projects. In Winterthur, 38 citizens used it to allocate CHF 380,000 across a broader cultural portfolio.
  why: >-
    Many participatory budgeting systems choose between simple popularity and deliberative judgment. KES gives both signals a common budgetary language through priceability, making it possible to connect individual preferences, collectively defined impact fields, proportional allocation, and explainable receipts.
  abstract: >-
    Public funding processes demand fairness, learning, and outcomes that participants can understand. We introduce Komitee Equal Shares, a priceable virtual-budget allocation framework that integrates two signals: in voter mode, participants cast point votes; in evaluator mode, small groups assess proposals against collectively defined impact fields. The framework extends the Method of Equal Shares by translating both signals into virtual spending power and producing explicit "voting receipts." We deployed the framework in the 2025 Kultur Komitee in Winterthur, Switzerland (N = 38), allocating CHF 380,000. Our results show that this hybrid approach generates a more diverse portfolio than simple aggregation and that participants value the fair process over individual control. The framework offers a model where citizens act as both voters and evaluators within a single, proportional, and explainable allocation.
  stats:
    - value: "CHF 380k"
      label: "allocated in Winterthur"
    - value: "38"
      label: "randomly selected citizens"
    - value: "43"
      label: "projects funded by KES"
    - value: "94%"
      label: "reported high satisfaction with influence"
  highlights:
    - title: "Two citizen roles"
      text: "Voter mode captures personal preferences; evaluator mode asks small groups to assess projects against shared impact fields."
    - title: "Priceability becomes design"
      text: "A project is funded only when supporters can collectively pay for it from virtual budgets."
    - title: "Receipts make fairness visible"
      text: "The output records how individual and impact-field budgets contributed to each funded project."
    - title: "More diverse portfolio"
      text: "KES funded 43 projects, compared with 35 under individual-only greedy aggregation and 33 under group-only greedy aggregation."
  best_for: "Practitioners and researchers working on participatory budgeting, citizen assemblies, fair allocation, civic funding, or explainable democratic algorithms."
  keywords:
    - participatory budgeting
    - Method of Equal Shares
    - algorithmic accountability
    - deliberation
    - digital democracy
  apa: >-
    Yang, J. C., Scheurer, N., & Helbing, D. (2026). Komitee Equal Shares: A Hybrid Algorithm for Priceable Participatory Funding. Extended Abstracts of the 2026 CHI Conference on Human Factors in Computing Systems.
  bibtex: |-
    @inproceedings{10.1145/3772363.3798958,
      author    = {Yang, Joshua C. and Scheurer, Noemi and Helbing, Dirk},
      title     = {Komitee Equal Shares: A Hybrid Algorithm for Priceable Participatory Funding},
