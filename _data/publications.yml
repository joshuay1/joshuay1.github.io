yang2026belief:
  slug: belief-engine
  title: "Belief Engine: Configurable and Inspectable Stance Dynamics in Multi-Agent LLM Deliberation"
  short_title: "Belief Engine"
  authors:
    - name: Joshua C. Yang
    - name: Maurice Flechtner
    - name: Damian Dailisan
    - name: Michiel A. Bakker
  author_text: "Joshua C. Yang, Maurice Flechtner, Damian Dailisan, and Michiel A. Bakker"
  year: "2026"
  publication_date: "2026"
  venue: "arXiv preprint arXiv:2605.15343"
  venue_type: "Preprint"
  arxiv: "2605.15343"
  source_url: "https://arxiv.org/abs/2605.15343"
  pdf_url: "https://arxiv.org/pdf/2605.15343"
  preview: "/assets/img/publication_preview/belief-engine.png"
  selected: true
  tldr: >-
    LLM agents often drift because they do not have a stable inner core. Belief Engine gives an AI agent a traceable stance it can hold onto, while still letting it be persuaded by good evidence. The result is an agent that can stay coherent, change its mind, and show why it changed.
  why: >-
    Multi-agent LLM simulations can look persuasive while hiding why agents change their minds. This work makes stance change explicit, configurable, and empirically testable, so researchers can separate evidence-responsive movement from anchoring, prompt effects, retrieval artifacts, and model bias.
  abstract: >-
    We introduce Belief Engine, an auditable belief-update layer for multi-agent LLM deliberation. The system extracts arguments into structured memory and updates stance with configurable log-odds dynamics, making belief change more inspectable and useful for studying social simulation, disagreement, and deliberation.
  stats:
    - value: "2,495"
      label: "human DEBATE trajectories replayed"
    - value: "0.967"
      label: "correlation between assigned and judged stance"
    - value: "0.465"
      label: "pooled replay RMSE"
    - value: "15"
      label: "round generated debates"
  highlights:
    - title: "Belief is explicit state"
      text: "The system maintains proposition-level stance instead of inferring belief only from generated text."
    - title: "Two interpretable controls"
      text: "Evidence uptake tunes responsiveness to new arguments; prior anchoring tunes persistence of the initial position."
    - title: "Human replay is diagnostic"
      text: "The DEBATE replay shows that one global human-like update profile misses stable, evidence-aligned, and evidence-opposed participants."
    - title: "Useful beyond prediction"
      text: "The main value is an audit trail: why an agent moved, stayed stable, or diverged from the evidence stream."
  best_for: "Researchers building LLM deliberation, civic simulation, agent memory, opinion-dynamics, or AI mediation systems where hidden stance changes would be unacceptable."
  keywords:
    - multi-agent LLM deliberation
    - belief dynamics
    - stance updating
    - social simulation
    - deliberation
  apa: >-
    Yang, J. C., Flechtner, M., Dailisan, D., & Bakker, M. A. (2026). Belief Engine: Configurable and Inspectable Stance Dynamics in Multi-Agent LLM Deliberation. arXiv preprint arXiv:2605.15343.
  bibtex: |-
    @misc{yang2026belief,
      title   = {Belief Engine: Configurable and Inspectable Stance Dynamics in Multi-Agent LLM Deliberation},
      author  = {Yang, Joshua C and Flechtner, Maurice and Dailisan, Damian and Bakker, Michiel A},
      journal = {arXiv preprint arXiv:2605.15343},
      year    = {2026},
      arxiv   = {2605.15343},
      url     = {https://arxiv.org/abs/2605.15343}
    }

yang2024llm:
  slug: llm-voting
  title: "LLM Voting: Human Choices and AI Collective Decision Making"
  short_title: "LLM Voting"
  authors:
    - name: Joshua C. Yang
    - name: Marcin Korecki
    - name: Damian Dailisan
    - name: Carina I. Hausladen
    - name: Dirk Helbing
  author_text: "Joshua C. Yang, Marcin Korecki, Damian Dailisan, Carina I. Hausladen, and Dirk Helbing"
  year: "2024"
  publication_date: "2024"
  venue: "7th AAAI Conference on AI, Ethics, and Society"
  venue_type: "Conference"
  arxiv: "2402.01766"
  source_url: "https://arxiv.org/abs/2402.01766"
  pdf_url: "https://arxiv.org/pdf/2402.01766"
  preview: "/assets/img/publication_preview/persona.png"
  selected: true
  tldr: >-
    What happens if AI agents are asked to vote for people? This paper shows that LLM voters can look useful, but their choices can shift with ballot order, prompt style, personas, and temperature. That makes them powerful democratic tools only if their biases are measured and governed.
  why: >-
    As LLMs are proposed as assistants, proxies, or digital twins in collective decision making, the practical question is not whether they can cast a ballot. It is whether small prompt and interface choices quietly reshape the electorate. This paper makes that risk measurable.
  abstract: >-
    This paper explores how Large Language Models (LLMs) can participate in and support human collective decision making. Through experiments comparing human and LLM voting behaviors, the work investigates alignment, bias, and interpretability in AI-assisted democratic processes.
  stats:
    - value: "180"
      label: "human and LLM voters per condition"
    - value: "24"
      label: "participatory budgeting projects"
    - value: "4"
      label: "voting input methods tested"
    - value: "CHF 60k"
      label: "budget framing"
  highlights:
    - title: "Presentation matters"
      text: "Order and numeric labels changed LLM outcomes in ways that should be normatively irrelevant."
    - title: "Personas help and distort"
      text: "Persona prompts can improve alignment with human choices while also over-structuring or compressing diversity."
    - title: "CoT is not a cure"
      text: "Reflection-style prompting did not reliably improve predictive accuracy of human votes."
    - title: "Temperature is political"
      text: "Higher temperature increases diversity, but that diversity can trade off against alignment and coherence."
  best_for: "Readers interested in AI voting agents, democratic digital twins, participatory budgeting, social-choice evaluation, and the governance risks of LLM-mediated collective decisions."
  keywords:
    - LLM voting
    - collective decision making
    - AI ethics
    - democratic processes
    - human-AI alignment
  apa: >-
    Yang, J. C., Korecki, M., Dailisan, D., Hausladen, C. I., & Helbing, D. (2024). LLM Voting: Human Choices and AI Collective Decision Making. 7th AAAI Conference on AI, Ethics, and Society.
  bibtex: |-
    @inproceedings{yang2024llm,
      title     = {LLM Voting: Human Choices and AI Collective Decision Making},
      author    = {Yang, Joshua C and Korecki, Marcin and Dailisan, Damian and Hausladen, Carina I and Helbing, Dirk},
      booktitle = {7th AAAI Conference on AI, Ethics, and Society},
      year      = {2024}
    }

